name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      # Warnings are errors (Directory.Build.props), so analyzers and code style gate the build.
      - run: dotnet build --no-restore -c Release
      # Unit, integration (real API + SQLite, concurrent writers) and architecture tests.
      - run: dotnet test --no-build -c Release

  web:
    name: Angular tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Strict TypeScript and strict templates: type errors fail the build.
      - run: npm test
      - run: npm run build

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Start the container and check the UI and the API
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/ | grep -q '<app-root>'
          curl -fs 'http://localhost:8080/api/products?pageSize=1' | grep -q '"totalCount"'
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
